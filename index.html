<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmuration Lab</title>
  <style>
    :root {
      color-scheme: light;
      --ink: oklch(22% 0.01 245);
      --muted: oklch(49% 0.012 245);
      --line: oklch(86% 0.008 245);
      --panel: oklch(97% 0.004 245);
      --paper: #FFFFFF;
      --stage: #FFFFFF;
      --accent: oklch(45% 0.12 212);
      --state-transition-duration: 200ms;
      --state-transition-ease: cubic-bezier(0.65, 0, 0.35, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: 100vh;
    }

    .app[data-theme="dark"] {
      color-scheme: dark;
      --ink: oklch(91% 0.008 245);
      --muted: oklch(68% 0.012 245);
      --line: oklch(28% 0.012 245);
      --panel: oklch(18% 0.01 245);
      --paper: #000000;
      --stage: #000000;
      --accent: oklch(72% 0.11 200);
    }

    .app.is-panel-hidden {
      grid-template-columns: minmax(0, 1fr) 0;
    }

    .stage {
      position: relative;
      min-width: 0;
      background: var(--stage);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100vh;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      left: 70px;
      top: 18px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in oklch, var(--paper), transparent 12%);
      backdrop-filter: blur(8px);
      font-size: 12px;
      color: var(--muted);
    }

    .brand-logo {
      position: absolute;
      left: 22px;
      top: 18px;
      z-index: 4;
      width: 34px;
      height: 34px;
      pointer-events: none;
    }

    .stage-actions {
      position: absolute;
      right: 22px;
      top: 18px;
      z-index: 4;
      display: flex;
      gap: 8px;
    }

    .stage-actions button {
      width: auto;
      min-height: 34px;
      padding: 0 12px;
      border-color: color-mix(in oklch, var(--line), var(--ink) 8%);
      background: color-mix(in oklch, var(--paper), transparent 10%);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 28px color-mix(in oklch, var(--ink), transparent 92%);
      font-size: 12px;
      color: var(--ink);
    }

    .interface-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 656px);
      height: auto;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 18px 44px color-mix(in oklch, var(--ink), transparent 88%));
      will-change: opacity;
      transition: opacity var(--state-transition-duration) var(--state-transition-ease);
    }

    .interface-overlay.is-visible {
      opacity: 1;
    }

    .ai-response-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      transition: opacity var(--state-transition-duration) var(--state-transition-ease);
    }

    .ai-response-main {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(46vw, 656px);
      max-width: calc(100% - 48px);
      max-height: calc(100vh - 144px);
      transform: translate(-50%, -50%);
      object-fit: contain;
    }

    .ai-response-footer {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: min(calc(100% - 48px), 672px);
      transform: translateX(-50%);
    }

    .app.is-ai-response .interface-overlay {
      opacity: 0;
    }

    .app.is-ai-response .ai-response-layer.is-visible {
      opacity: 1;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent), transparent 82%);
    }

    aside {
      height: 100vh;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 18px;
      transition: opacity 180ms ease-out, transform 180ms ease-out;
    }

    .app.is-panel-hidden aside {
      opacity: 0;
      transform: translateX(18px);
      pointer-events: none;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
      font-weight: 650;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .group {
      padding: 14px 0 16px;
      border-top: 1px solid var(--line);
    }

    .group-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: oklch(38% 0.012 245);
    }

    label {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin: 11px 0;
      font-size: 13px;
      color: var(--ink);
    }

    .value {
      min-width: 54px;
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--accent);
    }

    input[type="color"] {
      inline-size: 34px;
      block-size: 28px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
    }

    select, button, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: oklch(99% 0.004 245);
      color: var(--ink);
      font: inherit;
    }

    select, button {
      min-height: 34px;
      padding: 0 10px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 620;
      cursor: pointer;
      transition: background 160ms ease-out, border-color 160ms ease-out, transform 160ms ease-out;
    }

    button:hover { background: oklch(96% 0.007 245); }
    button:active { transform: translateY(1px); }
    button.primary {
      border-color: color-mix(in oklch, var(--accent), black 12%);
      background: var(--accent);
      color: oklch(99% 0.004 245);
    }
    button.primary:hover { background: color-mix(in oklch, var(--accent), black 8%); }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .actions.single {
      grid-template-columns: 1fr;
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      padding: 10px;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: oklch(29% 0.01 245);
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .preset-row button { font-size: 12px; }

    .preset-row button.is-active {
      border-color: color-mix(in oklch, var(--accent), black 10%);
      background: color-mix(in oklch, var(--accent), white 84%);
      color: color-mix(in oklch, var(--accent), black 28%);
    }

    .app[data-theme="dark"] .preset-row button.is-active {
      background: color-mix(in oklch, var(--accent), black 72%);
      color: var(--ink);
    }

    .transition-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: var(--ink);
      font-size: 13px;
    }

    .transition-control input {
      width: 92px;
      min-height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: oklch(99% 0.004 245);
      color: var(--ink);
      font: inherit;
      text-align: right;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; }
      .app.is-panel-hidden { grid-template-columns: 1fr; }
      canvas { height: 58vh; }
      .interface-overlay { width: min(88vw, 560px); }
      .ai-response-main { width: min(88vw, 656px); max-height: calc(58vh - 100px); }
      .ai-response-footer { bottom: 16px; width: min(calc(100% - 32px), 672px); }
      .hud { left: 64px; }
      aside {
        height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .app.is-panel-hidden aside {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app" data-theme="light">
    <section class="stage" aria-label="Effect preview">
      <canvas id="murmuration"></canvas>
      <img class="brand-logo" src="assets/animated-logo.svg" alt="Animated brand logo">
      <img class="interface-overlay is-visible" id="interfaceOverlay" src="assets/nsiq-overlay-light.svg" alt="Interface overlay preview">
      <div class="ai-response-layer" id="aiResponseLayer" aria-hidden="true">
        <img class="ai-response-main" src="assets/ai-response-main.svg" alt="">
        <img class="ai-response-footer" src="assets/ai-response-footer.svg" alt="">
      </div>
      <div class="hud"><span class="dot"></span><span id="readout">16000 particles</span></div>
      <div class="stage-actions">
        <button id="responseToggle" type="button" aria-pressed="false">Chat</button>
        <button id="themeToggle" type="button" aria-pressed="false">Dark</button>
        <button id="overlayToggle" class="is-active" type="button" aria-pressed="true">Overlay</button>
        <button id="panelToggle" type="button" aria-controls="settingsPanel" aria-expanded="true">Hide panel</button>
      </div>
    </section>
    <aside id="settingsPanel">
      <h1>Murmuration Lab</h1>
      <p class="sub">An exportable particle background for web interfaces. Tune the motion, silhouette, axis, color, and density, then copy the generated Canvas module.</p>

      <div class="group">
        <div class="group-title">Presets</div>
        <div class="preset-row">
          <button data-preset="paper">Paper</button>
          <button data-preset="night">Night</button>
          <button data-preset="warm">Warm</button>
        </div>
        <label class="transition-control" for="transitionDuration">
          Transition duration
          <input id="transitionDuration" type="number" min="0" max="5000" step="50" value="200" inputmode="numeric" aria-label="Transition duration in milliseconds">
        </label>
      </div>

      <div class="group" id="controls"></div>

      <div class="group">
        <div class="group-title">Composition</div>
        <label>Axis
          <select id="axis">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
            <option value="diagonal">Diagonal</option>
          </select>
        </label>
        <label>Shape
          <select id="shape">
            <option value="ridge">Ridge</option>
            <option value="wave">Wave</option>
            <option value="arch">Arch</option>
            <option value="vortex">Vortex</option>
            <option value="veil">Veil</option>
            <option value="spiral">Spiral</option>
            <option value="circle">Circle</option>
            <option value="flock">Flock</option>
            <option value="swoop">Swoop</option>
            <option value="split-flock">Split flock</option>
          </select>
        </label>
      </div>

      <div class="group">
        <div class="group-title">Colors</div>
        <label>Particles <input type="color" id="particleColor" value="#C2C2C2"></label>
        <label>Background <input type="color" id="backgroundColor" value="#FFFFFF"></label>
      </div>

      <div class="group">
        <div class="group-title">Export</div>
        <textarea id="exportCode" spellcheck="false"></textarea>
        <div class="actions">
          <button id="copyBtn" class="primary">Copy</button>
          <button id="downloadBtn">Download JS</button>
        </div>
        <div class="actions single">
          <button id="copyPreviewBtn">Copy preview link</button>
        </div>
      </div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("murmuration");
    const ctx = canvas.getContext("2d", { alpha: false });
    const readout = document.getElementById("readout");
    const exportCode = document.getElementById("exportCode");
    const interfaceOverlay = document.getElementById("interfaceOverlay");
    const aiResponseLayer = document.getElementById("aiResponseLayer");
    const overlayToggle = document.getElementById("overlayToggle");
    const app = document.getElementById("app");
    const panelToggle = document.getElementById("panelToggle");
    const themeToggle = document.getElementById("themeToggle");
    const copyPreviewBtn = document.getElementById("copyPreviewBtn");
    const responseToggle = document.getElementById("responseToggle");
    const transitionDurationInput = document.getElementById("transitionDuration");

    const settings = {
      theme: "light",
      overlay: true,
      particles: 16000,
      speed: 0.55,
      turbulence: 0.42,
      rotation: 0,
      axis: "horizontal",
      shape: "ridge",
      coverage: 0.72,
      formationScale: 1.18,
      ambientParticles: 0.34,
      spread: 0.88,
      scatter: 0.34,
      coordination: 0.8,
      gathering: 0.55,
      dispersal: 0.38,
      reformation: 0.64,
      responsiveness: 0.35,
      calmness: 0.82,
      dataStructure: 0.32,
      patternSubtlety: 0.74,
      negativeSpace: 0.62,
      edgeSoftness: 0.8,
      depth: 0.55,
      grain: 0.48,
      crest: 0.62,
      arch: 0.54,
      density: 0.72,
      particleSize: 0.72,
      fade: 0.22,
      centerAttenuation: 0,
      particleColor: "#C2C2C2",
      backgroundColor: "#FFFFFF"
    };

    const controlGroups = [
      {
        title: "Core",
        controls: [
          ["particles", "Particles", 2000, 32000, 1000],
          ["speed", "Speed", 0, 2, 0.01],
          ["rotation", "Rotation", -35, 35, 1],
          ["coverage", "Coverage", 0, 1, 0.01],
          ["formationScale", "Formation scale", 0.7, 1.8, 0.01],
          ["ambientParticles", "Ambient particles", 0, 0.75, 0.01],
          ["spread", "Spread", 0.35, 1.4, 0.01],
          ["scatter", "Scatter", 0, 1.2, 0.01]
        ]
      },
      {
        title: "Swarm behavior",
        controls: [
          ["coordination", "Coordination", 0, 1, 0.01],
          ["gathering", "Gathering", 0, 1, 0.01],
          ["dispersal", "Dispersal", 0, 1, 0.01],
          ["reformation", "Reformation", 0, 1, 0.01],
          ["responsiveness", "Responsiveness", 0, 1, 0.01],
          ["calmness", "Calmness", 0, 1, 0.01]
        ]
      },
      {
        title: "Pattern",
        controls: [
          ["turbulence", "Turbulence", 0, 1.4, 0.01],
          ["dataStructure", "Data structure", 0, 1, 0.01],
          ["patternSubtlety", "Pattern subtlety", 0, 1, 0.01],
          ["negativeSpace", "Negative space", 0, 1, 0.01],
          ["edgeSoftness", "Edge softness", 0, 1, 0.01],
          ["crest", "Crest", 0.1, 1.1, 0.01],
          ["arch", "Opening", 0.1, 1.1, 0.01],
          ["density", "Density", 0.1, 1, 0.01]
        ]
      },
      {
        title: "Visual",
        controls: [
          ["particleSize", "Particle size", 0.35, 1.8, 0.01],
          ["fade", "Trail", 0.04, 0.5, 0.01],
          ["centerAttenuation", "Center attenuation", 0, 1, 0.01],
          ["depth", "Depth", 0, 1, 0.01],
          ["grain", "Grain", 0, 1, 0.01]
        ]
      }
    ];
    const controls = controlGroups.flatMap(group => group.controls);

    const particles = [];
    let w = 1;
    let h = 1;
    let dpr = 1;
    let t = 0;
    let animationId = 0;
    let transitionFrame = 0;
    let previewState = "information";
    let overlayVisible = true;
    let transitionDuration = 200;
    const stateConfigs = {
      information: null,
      response: null
    };

    const aiResponseDefaults = {
      coverage: 0.9,
      formationScale: 1.35,
      ambientParticles: 0.48,
      spread: 1.15,
      scatter: 0.62,
      coordination: 0.68,
      gathering: 0.3,
      dispersal: 0.72,
      reformation: 0.58,
      responsiveness: 0.48,
      calmness: 0.62,
      turbulence: 0.56,
      negativeSpace: 0.32,
      edgeSoftness: 0.72,
      density: 0.62,
      fade: 0.18,
      centerAttenuation: 0
    };

    function rand(seed) {
      const x = Math.sin(seed * 127.1) * 43758.5453123;
      return x - Math.floor(x);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function smoothstep(min, max, value) {
      const progress = clamp((value - min) / (max - min), 0, 1);
      return progress * progress * (3 - 2 * progress);
    }

    function centerAttenuationAt(x) {
      const horizontalPosition = x / w;
      const centerBand = smoothstep(0.15, 0.25, horizontalPosition) * (1 - smoothstep(0.75, 0.85, horizontalPosition));
      return 1 - centerBand * settings.centerAttenuation * 0.95;
    }

    function stateSnapshot(source = settings) {
      const { theme, overlay, ...state } = source;
      return state;
    }

    function sharedPreviewState() {
      return {
        version: 2,
        activeState: previewState,
        theme: settings.theme,
        overlay: overlayVisible,
        transitionDuration,
        states: stateConfigs
      };
    }

    function encodeSettings() {
      const json = JSON.stringify(sharedPreviewState());
      const bytes = new TextEncoder().encode(json);
      let binary = "";
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeSettings(value) {
      const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function getPreviewUrl() {
      const url = new URL(location.href);
      url.searchParams.set("config", encodeSettings());
      return url.toString();
    }

    function updatePreviewUrl() {
      const url = new URL(location.href);
      url.searchParams.set("config", encodeSettings());
      history.replaceState(null, "", url);
    }

    function applyThemePalette(target = settings) {
      const isDark = settings.theme === "dark";
      target.backgroundColor = isDark ? "#000000" : "#FFFFFF";
      target.particleColor = isDark ? "#737373" : "#C2C2C2";
      target.fade = isDark ? Math.min(target.fade, 0.2) : Math.max(target.fade, 0.22);
    }

    function applyStateConfig(nextState) {
      const { overlay, ...state } = nextState;
      Object.assign(settings, state, { theme: settings.theme });
      applyThemePalette();
    }

    function applySharedConfig() {
      const encoded = new URLSearchParams(location.search).get("config");
      if (!encoded) return false;
      try {
        const shared = decodeSettings(encoded);
        if (shared.version === 2 && shared.states?.information && shared.states?.response) {
          settings.theme = shared.theme === "dark" ? "dark" : "light";
          overlayVisible = typeof shared.overlay === "boolean"
            ? shared.overlay
            : Boolean(shared.states[shared.activeState === "response" ? "response" : "information"].overlay ?? settings.overlay);
          settings.overlay = overlayVisible;
          if (Number.isFinite(shared.transitionDuration)) {
            transitionDuration = clamp(shared.transitionDuration, 0, 5000);
          }
          stateConfigs.information = { ...stateSnapshot(), ...shared.states.information };
          stateConfigs.response = { ...stateSnapshot(), ...aiResponseDefaults, ...shared.states.response };
          previewState = shared.activeState === "response" ? "response" : "information";
          applyStateConfig(stateConfigs[previewState]);
          return true;
        }

      // Support preview links created before state-specific sharing existed.
      Object.keys(settings).forEach(key => {
        if (Object.prototype.hasOwnProperty.call(shared, key)) settings[key] = shared[key];
      });
      if (typeof shared.overlay === "boolean") overlayVisible = shared.overlay;
      if (Number.isFinite(shared.transitionDuration)) {
        transitionDuration = clamp(shared.transitionDuration, 0, 5000);
      }
      } catch (error) {
        console.warn("Could not load shared murmuration config.", error);
      }
      return false;
    }

    function syncControlsFromSettings() {
      app.dataset.theme = settings.theme;
      app.style.setProperty("--state-transition-duration", `${transitionDuration}ms`);
      interfaceOverlay.src = settings.theme === "dark" ? "assets/nsiq-overlay-dark.svg" : "assets/nsiq-overlay-light.svg";
      interfaceOverlay.classList.toggle("is-visible", overlayVisible);
      aiResponseLayer.classList.toggle("is-visible", overlayVisible);
      aiResponseLayer.setAttribute("aria-hidden", String(!overlayVisible));
      overlayToggle.classList.toggle("is-active", overlayVisible);
      overlayToggle.setAttribute("aria-pressed", String(overlayVisible));
      themeToggle.textContent = settings.theme === "dark" ? "Light" : "Dark";
      themeToggle.setAttribute("aria-pressed", String(settings.theme === "dark"));
      responseToggle.textContent = previewState === "response" ? "Home" : "Chat";
      responseToggle.setAttribute("aria-pressed", String(previewState === "response"));
      transitionDurationInput.value = transitionDuration;
      document.getElementById("particleColor").value = settings.particleColor;
      document.getElementById("backgroundColor").value = settings.backgroundColor;
      document.getElementById("axis").value = settings.axis;
      document.getElementById("shape").value = settings.shape;
      controls.forEach(([key]) => {
        document.getElementById(key).value = settings[key];
        document.getElementById(`${key}Value`).textContent = settings[key];
      });
    }

    function saveActiveState() {
      stateConfigs[previewState] = stateSnapshot();
    }

    function resize() {
      const box = canvas.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = Math.max(1, Math.floor(box.width));
      h = Math.max(1, Math.floor(box.height));
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      syncParticleCount();
      clearFrame();
    }

    function syncParticleCount() {
      while (particles.length < settings.particles) particles.push(makeParticle(particles.length + 1));
      particles.length = settings.particles;
      particles.forEach((particle, index) => {
        particle.index = particle.index || index + 1;
        particle.field = rand(particle.index + 77) < settings.ambientParticles;
      });
      readout.textContent = `${settings.particles.toLocaleString("en-US")} particles`;
    }

    function makeParticle(i) {
      const r = Math.sqrt(Math.random());
      const a = Math.random() * Math.PI * 2;
      const field = rand(i + 77) < settings.ambientParticles;
      return {
        x: field ? Math.random() * w : w * 0.5 + Math.cos(a) * r * w * 0.42,
        y: field ? Math.random() * h : h * 0.58 + Math.sin(a) * r * h * 0.28,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,

      let x = w * 0.5 + structuredU * w * 0.54 * settings.spread * settings.formationScale;

        const radius = (0.12 + abs * 0.42 + n * 0.04) * Math.min(w, h) * settings.spread * settings.formationScale;

        y = h * 0.55 + Math.sin(turn) * radius * (0.35 + settings.arch * 0.55);

        const turn = rand(p.seed + 307) * Math.PI * 2 + phase * 0.00035;
        const radius = Math.sqrt(rand(p.seed + 719)) * Math.min(w, h) * 0.38 * settings.spread * settings.formationScale;
        x = w * 0.5 + Math.cos(turn) * radius + n * band * 0.25;

        const head = Math.exp(-Math.pow(structuredU + 0.42, 2) * 28) * h * 0.3 * settings.crest;

        const trailingWing = Math.pow((structuredU + 1) * 0.5, 2.15) * h * 0.24 * settings.arch;
        x += Math.sin((structuredU + 0.2) * Math.PI) * w * 0.045 * settings.spread;
        y = h * 0.66 - head - shoulder + trailingWing + Math.sin(structuredU * Math.PI * 1.6 + phase * 0.0017) * h * 0.035 + n * band * 0.72;

          paper: { theme: "light", particleColor: "#C2C2C2", backgroundColor: "#FFFFFF", fade: 0.24, centerAttenuation: 0, turbulence: 0.42, axis: "horizontal", shape: "ridge", coverage: 0.72, formationScale: 1.18, ambientParticles: 0.34, spread: 1.02, scatter: 0.42, coordination: 0.8, gathering: 0.46, dispersal: 0.48, reformation: 0.64, responsiveness: 0.35, calmness: 0.82, dataStructure: 0.32, patternSubtlety: 0.74, negativeSpace: 0.56, edgeSoftness: 0.8, depth: 0.55, grain: 0.48 },
          night: { theme: "dark", particleColor: "#737373", backgroundColor: "#000000", fade: 0.18, centerAttenuation: 0, turbulence: 0.5, axis: "diagonal", shape: "wave", coverage: 0.82, formationScale: 1.26, ambientParticles: 0.42, spread: 1.08, scatter: 0.56, coordination: 0.72, gathering: 0.38, dispersal: 0.62, reformation: 0.7, responsiveness: 0.52, calmness: 0.66, dataStructure: 0.48, patternSubtlety: 0.62, negativeSpace: 0.36, edgeSoftness: 0.72, depth: 0.78, grain: 0.38 },
          warm: { theme: "light", particleColor: "#C2C2C2", backgroundColor: "#FFFFFF", fade: 0.26, centerAttenuation: 0, turbulence: 0.36, axis: "horizontal", shape: "veil", coverage: 0.68, formationScale: 1.14, ambientParticles: 0.38, spread: 1, scatter: 0.36, coordination: 0.86, gathering: 0.5, dispersal: 0.38, reformation: 0.58, responsiveness: 0.25, calmness: 0.9, dataStructure: 0.22, patternSubtlety: 0.82, negativeSpace: 0.64, edgeSoftness: 0.86, depth: 0.45, grain: 0.52 }
        };
        Object.assign(settings, presets[button.dataset.preset]);
        syncControlsFromSettings();
        syncParticleCount();
        saveActiveState();
        refreshExport();
        clearFrame();
        updatePreviewUrl();
      });
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(exportCode.value);
    });

    copyPreviewBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(getPreviewUrl());
      copyPreviewBtn.textContent = "Preview link copied";
      setTimeout(() => { copyPreviewBtn.textContent = "Copy preview link"; }, 1400);
    });

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const blob = new Blob([exportedModule()], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "murmuration-background.js";
      a.click();
      URL.revokeObjectURL(url);
    });

    overlayToggle.addEventListener("click", () => {
      overlayVisible = !overlayVisible;
      settings.overlay = overlayVisible;
      syncControlsFromSettings();
      refreshExport();
      updatePreviewUrl();
    });

    themeToggle.addEventListener("click", () => {
      settings.theme = settings.theme === "dark" ? "light" : "dark";
      applyThemePalette();
      Object.values(stateConfigs).filter(Boolean).forEach(applyThemePalette);
      syncControlsFromSettings();
      saveActiveState();
      refreshExport();
      clearFrame();
      updatePreviewUrl();
    });

    panelToggle.addEventListener("click", () => {
      const isHidden = app.classList.toggle("is-panel-hidden");
      panelToggle.textContent = isHidden ? "Show panel" : "Hide panel";
      panelToggle.setAttribute("aria-expanded", String(!isHidden));
      requestAnimationFrame(resize);
    });

    responseToggle.addEventListener("click", () => {
      setPreviewState(previewState === "response" ? "information" : "response");
    });

    refreshExport();
    addEventListener("resize", resize);
    resize();
    draw();
  </script>
</body>
</html>
