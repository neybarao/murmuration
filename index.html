<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Murmuration Lab</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #F6F7F8;
      --field: #FFFFFF;
      --field-hover: #EDF0F2;
      --ink: #16191C;
      --muted: #59616A;
      --line: #D3D9DE;
      --accent: #0B6E7F;
      --accent-ink: #FFFFFF;
      --accent-soft: #DCEFF2;
      --danger: #B3261E;
      --chip: rgba(255, 255, 255, 0.92);
      --shadow: 0 6px 20px rgba(22, 25, 28, 0.1);
      --dur: 200ms;
      --ease: cubic-bezier(0.65, 0, 0.35, 1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    .app[data-theme="dark"] {
      color-scheme: dark;
      --surface: #14171A;
      --field: #1D2125;
      --field-hover: #292E34;
      --ink: #E9ECEF;
      --muted: #A3ABB3;
      --line: #343B42;
      --accent: #5CC4D6;
      --accent-ink: #06222A;
      --accent-soft: #123740;
      --danger: #FF8F86;
      --chip: rgba(29, 33, 37, 0.92);
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FFFFFF;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      min-height: 100vh;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
    }

    .app.is-panel-hidden { grid-template-columns: minmax(0, 1fr) 0; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Stage */
    .stage {
      position: relative;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
      /* The runtime places its canvas at z-index -1; isolate so it stays above the stage background. */
      isolation: isolate;
      background: var(--field);
      cursor: crosshair;
    }

    .brand-logo {
      position: absolute;
      left: 20px;
      top: 18px;
      z-index: 4;
      width: 34px;
      height: 34px;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      left: 66px;
      top: 18px;
      z-index: 4;
      display: flex;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--chip);
      backdrop-filter: blur(8px);
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .stage-actions {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: calc(100% - 32px);
    }

    .segmented, .chip {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--chip);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .segmented button, .chip button {
      min-height: 30px;
      padding: 0 13px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: 560;
      cursor: pointer;
    }

    .segmented button:hover, .chip button:hover { background: var(--field-hover); }

    .segmented button[aria-pressed="true"],
    .chip button.is-on {
      background: var(--accent);
      color: var(--accent-ink);
    }

    /* Interface overlay preview */
    .interface-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(78vw, 656px);
      height: auto;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 18px 44px rgba(22, 25, 28, 0.12));
      will-change: opacity;
      transition: opacity var(--dur) var(--ease);
    }

    .interface-overlay.is-visible { opacity: 1; }

    .ai-response-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      will-change: opacity;
      transition: opacity var(--dur) var(--ease);
    }

    .ai-response-main {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(46vw, 656px);
      max-width: calc(100% - 48px);
      max-height: calc(100vh - 144px);
      transform: translate(-50%, -50%);
      object-fit: contain;
    }

    .ai-response-footer {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: min(calc(100% - 48px), 672px);
      transform: translateX(-50%);
    }

    .app.is-ai-response .interface-overlay { opacity: 0; }
    .app.is-ai-response .ai-response-layer.is-visible { opacity: 1; }

    /* Settings panel */
    aside {
      height: 100vh;
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--surface);
      padding: 18px 18px 28px;
      transition: opacity 180ms ease-out, transform 180ms ease-out;
    }

    .app.is-panel-hidden aside {
      opacity: 0;
      transform: translateX(18px);
      pointer-events: none;
      overflow: hidden;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.2;
    }

    .context {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    section.group {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 650;
    }

    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0;
    }

    .field {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      column-gap: 8px;
      margin: 12px 0 0;
    }

    .field output {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .field input[type="range"] { grid-column: 1 / -1; }

    select, input[type="number"], textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
    }

    select, input[type="number"] {
      min-height: 32px;
      padding: 0 10px;
    }

    select { min-width: 148px; }
    input[type="number"] { width: 92px; text-align: right; }

    input[type="color"] {
      inline-size: 40px;
      block-size: 30px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      cursor: pointer;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 22px;
      margin: 0;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: var(--line);
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 2px;
      background: var(--line);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5px;
      border: 2px solid var(--field);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 2px solid var(--field);
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .btn {
      min-height: 32px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-weight: 560;
      cursor: pointer;
    }

    .btn:hover { background: var(--field-hover); }
    .btn:active { transform: translateY(1px); }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .btn.primary:hover { filter: brightness(1.08); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 170px;
      resize: vertical;
      padding: 10px;
      font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .status {
      min-height: 18px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status.is-error { color: var(--danger); }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; }
      .app.is-panel-hidden { grid-template-columns: 1fr; }
      .stage { height: 58vh; }
      .interface-overlay { width: min(88vw, 560px); }
      .ai-response-main { width: min(88vw, 656px); max-height: calc(58vh - 100px); }
      .ai-response-footer { bottom: 16px; width: min(calc(100% - 32px), 672px); }
      .hud { left: 64px; }
      aside {
        height: auto;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .app.is-panel-hidden aside { display: none; }
    }

    @media (max-width: 480px) {
      .hud { display: none; }
      .stage-actions { top: 60px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app" data-theme="light">
    <section class="stage" aria-label="Effect preview">
      <div id="murmuration" aria-hidden="true"></div>
      <img class="brand-logo" src="assets/animated-logo.svg" alt="Animated brand logo">
      <img class="interface-overlay is-visible" id="interfaceOverlay" src="assets/nsiq-overlay-light.svg" alt="Interface overlay preview">
      <div class="ai-response-layer" id="aiResponseLayer" aria-hidden="true">
        <img class="ai-response-main" src="assets/ai-response-main.svg" alt="">
        <img class="ai-response-footer" src="assets/ai-response-footer.svg" alt="">
      </div>
      <div class="hud"><span class="dot"></span><span id="readout">16,000 particles</span></div>
      <div class="stage-actions">
        <div class="segmented" role="group" aria-label="Screen">
          <button id="homeBtn" type="button" aria-pressed="true">Home</button>
          <button id="chatBtn" type="button" aria-pressed="false">Chat</button>
        </div>
        <div class="segmented" role="group" aria-label="Theme">
          <button id="lightBtn" type="button" aria-pressed="true">Light</button>
          <button id="darkBtn" type="button" aria-pressed="false">Dark</button>
        </div>
        <div class="chip"><button id="overlayToggle" class="is-on" type="button" aria-pressed="true">Overlay</button></div>
        <div class="chip"><button id="panelToggle" type="button" aria-controls="settingsPanel" aria-expanded="true">Hide panel</button></div>
      </div>
    </section>

    <aside id="settingsPanel">
      <h1>Murmuration Lab</h1>
      <p class="context" id="editingContext">Editing Home, light theme</p>

      <section class="group">
        <h2>Formation</h2>
        <div class="row">
          <label for="shape">Shape</label>
          <select id="shape">
            <option value="ridge">Ridge</option>
            <option value="wave">Wave</option>
            <option value="arch">Arch</option>
            <option value="vortex">Vortex</option>
            <option value="veil">Veil</option>
            <option value="spiral">Spiral</option>
            <option value="circle">Circle</option>
            <option value="flock">Flock</option>
            <option value="swoop">Swoop</option>
            <option value="split-flock">Split flock</option>
          </select>
        </div>
        <div class="row">
          <label for="axis">Axis</label>
          <select id="axis">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
            <option value="diagonal">Diagonal</option>
          </select>
        </div>
        <div id="formationControls"></div>
      </section>

      <section class="group">
        <h2>Motion</h2>
        <div id="motionControls"></div>
      </section>

      <section class="group">
        <h2>Look</h2>
        <div id="lookControls"></div>
      </section>

      <section class="group">
        <h2>Colors</h2>
        <div class="row"><label for="particleColor">Particles</label><input type="color" id="particleColor" value="#C2C2C2"></div>
        <div class="row"><label for="backgroundColor">Background</label><input type="color" id="backgroundColor" value="#FFFFFF"></div>
        <p class="hint" id="colorHint">Saved for Home in the light theme.</p>
      </section>

      <section class="group">
        <h2>Transition</h2>
        <div class="row">
          <label for="transitionDuration">Duration (ms)</label>
          <input id="transitionDuration" type="number" min="0" max="5000" step="50" value="200" inputmode="numeric">
        </div>
        <p class="hint">Applies to every screen and is saved with the config.</p>
      </section>

      <section class="group">
        <h2>Handoff</h2>
        <textarea id="exportCode" spellcheck="false" aria-label="Integration snippet" readonly></textarea>
        <div class="actions">
          <button id="copyBtn" class="btn primary" type="button">Copy</button>
          <button id="downloadBtn" class="btn" type="button">Download JS</button>
          <button id="copyPreviewBtn" class="btn" type="button">Copy preview link</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>
    </aside>
  </main>

  <script src="./particle-renderer.js"></script>
  <script src="./murmuration-runtime.js"></script>
  <script src="./murmuration-export.js"></script>
  <script>
    const el = id => document.getElementById(id);
    const stage = el("murmuration");
    const app = el("app");
    const readout = el("readout");
    const exportCode = el("exportCode");
    const status = el("status");
    const interfaceOverlay = el("interfaceOverlay");
    const aiResponseLayer = el("aiResponseLayer");
    const overlayToggle = el("overlayToggle");
    const panelToggle = el("panelToggle");
    const homeBtn = el("homeBtn");
    const chatBtn = el("chatBtn");
    const lightBtn = el("lightBtn");
    const darkBtn = el("darkBtn");
    const copyBtn = el("copyBtn");
    const downloadBtn = el("downloadBtn");
    const copyPreviewBtn = el("copyPreviewBtn");
    const transitionInput = el("transitionDuration");

    // Only these parameters are part of a saved state, the exported config and the share link.
    // Everything else the runtime supports keeps its built-in default.
    const controlGroups = [
      { target: "formationControls", controls: [
        ["formationScale", "Scale", 0.7, 1.8, 0.01],
        ["spread", "Spread", 0.35, 1.4, 0.01],
        ["scatter", "Scatter", 0, 1.2, 0.01],
        ["crest", "Crest", 0.1, 1.1, 0.01],
        ["rotation", "Rotation", -35, 35, 1]
      ] },
      { target: "motionControls", controls: [
        ["speed", "Speed", 0, 2, 0.01],
        ["particles", "Particles", 2000, 32000, 1000]
      ] },
      { target: "lookControls", controls: [
        ["particleSize", "Particle size", 0.35, 1.8, 0.01],
        ["fade", "Trail", 0.04, 0.5, 0.01],
        ["centerAttenuation", "Center attenuation", 0, 1, 0.01],
        ["depth", "Depth", 0, 1, 0.01],
        ["grain", "Grain", 0, 1, 0.01]
      ] }
    ];
    const controls = controlGroups.flatMap(group => group.controls);
    const SHAPES = ["ridge", "wave", "arch", "vortex", "veil", "spiral", "circle", "flock", "swoop", "split-flock"];
    const AXES = ["horizontal", "vertical", "diagonal"];
    const THEMES = ["light", "dark"];
    const COLOR_KEYS = ["particleColor", "backgroundColor"];
    const THEME_COLORS = {
      light: { particleColor: "#C2C2C2", backgroundColor: "#FFFFFF" },
      dark: { particleColor: "#737373", backgroundColor: "#000000" }
    };
    const PUBLIC_KEYS = ["shape", "axis", ...controls.map(([key]) => key)];
    // Names stay "information"/"response" internally so links created before this version still load.
    const STATE_LABELS = { information: "Home", response: "Chat" };
    const CHAT_DIFFERENCES = { formationScale: 1.35, spread: 1.15, scatter: 0.62, fade: 0.18, centerAttenuation: 0 };

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const isHex = value => typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value);

    function makeState(overrides = {}) {
      const source = { ...MURMURATION_DEFAULTS, ...overrides };
      return {
        ...Object.fromEntries(PUBLIC_KEYS.map(key => [key, source[key]])),
        colors: { light: { ...THEME_COLORS.light }, dark: { ...THEME_COLORS.dark } }
      };
    }

    // Accepts anything decoded from a link and returns a complete, in-range state.
    function sanitizeState(raw, base, legacyTheme) {
      const next = { ...base, colors: { light: { ...base.colors.light }, dark: { ...base.colors.dark } } };
      if (!raw || typeof raw !== "object") return next;
      controls.forEach(([key, , min, max]) => {
        if (typeof raw[key] === "number" && Number.isFinite(raw[key])) next[key] = clamp(raw[key], min, max);
      });
      if (SHAPES.includes(raw.shape)) next.shape = raw.shape;
      if (AXES.includes(raw.axis)) next.axis = raw.axis;
      THEMES.forEach(name => COLOR_KEYS.forEach(key => {
        if (isHex(raw.colors?.[name]?.[key])) next.colors[name][key] = raw.colors[name][key];
      }));
      // Links from before per-theme colors stored one flat pair, for whichever theme was active.
      if (!raw.colors && legacyTheme) COLOR_KEYS.forEach(key => {
        if (isHex(raw[key])) next.colors[legacyTheme][key] = raw[key];
      });
      return next;
    }

    let theme = "light";
    let overlayVisible = true;
    let transitionDuration = 200;
    let activeState = "information";
    const states = {
      information: makeState(),
      response: makeState(CHAT_DIFFERENCES)
    };

    function sharedPreviewState() {
      return { version: 3, activeState, theme, overlay: overlayVisible, transitionDuration, states };
    }

    function encodeSettings() {
      const bytes = new TextEncoder().encode(JSON.stringify(sharedPreviewState()));
      let binary = "";
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeSettings(value) {
      const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), char => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function getPreviewUrl() {
      const url = new URL(location.href);
      url.searchParams.set("config", encodeSettings());
      return url.toString();
    }

    function updatePreviewUrl() {
      history.replaceState(null, "", getPreviewUrl());
    }

    // A malformed link never blocks the editor: anything unreadable falls back to the defaults.
    function loadSharedConfig() {
      const encoded = new URLSearchParams(location.search).get("config");
      if (!encoded) return;
      try {
        const shared = decodeSettings(encoded);
        if (!shared || typeof shared !== "object") throw new Error("Not a config object");
        if (shared.theme === "dark") theme = "dark";
        if (typeof shared.overlay === "boolean") overlayVisible = shared.overlay;
        if (typeof shared.transitionDuration === "number" && Number.isFinite(shared.transitionDuration)) {
          transitionDuration = clamp(shared.transitionDuration, 0, 5000);
        }
        const legacyTheme = shared.version === 3 ? null : theme;
        const source = shared.states && typeof shared.states === "object" ? shared.states : { information: shared };
        Object.keys(states).forEach(name => {
          states[name] = sanitizeState(source[name], states[name], legacyTheme);
        });
        if (Object.prototype.hasOwnProperty.call(states, shared.activeState)) activeState = shared.activeState;
      } catch (error) {
        console.warn("Could not load shared murmuration config.", error);
      }
    }

    function exportPayload() {
      return { states: { home: states.information, chat: states.response }, transitionDuration, theme };
    }

    const refreshExport = () => { exportCode.value = buildMurmurationSnippet(exportPayload()); };
    const exportedModule = () => buildMurmurationModule(exportPayload());
    const commit = () => { refreshExport(); updatePreviewUrl(); };

    let statusTimer = 0;
    function announce(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("is-error", isError);
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => {
        status.textContent = "";
        status.classList.toggle("is-error", false);
      }, 2600);
    }

    async function copyText(text, label) {
      try {
        await navigator.clipboard.writeText(text);
        announce(`${label} copied.`);
      } catch (error) {
        announce(`Could not copy the ${label.toLowerCase()}. Select the text and copy it manually.`, true);
      }
    }

    function controlMarkup(group) {
      return group.controls.map(([key, label, min, max, step]) => `
        <div class="field">
          <label for="${key}">${label}</label>
          <output id="${key}Value" for="${key}"></output>
          <input type="range" id="${key}" min="${min}" max="${max}" step="${step}">
        </div>`).join("");
    }

    function syncControls() {
      const state = states[activeState];
      const modeName = STATE_LABELS[activeState];
      app.dataset.theme = theme;
      app.style.setProperty("--dur", `${transitionDuration}ms`);
      interfaceOverlay.src = theme === "dark" ? "assets/nsiq-overlay-dark.svg" : "assets/nsiq-overlay-light.svg";
      interfaceOverlay.classList.toggle("is-visible", overlayVisible);
      aiResponseLayer.classList.toggle("is-visible", overlayVisible);
      aiResponseLayer.setAttribute("aria-hidden", String(!overlayVisible));
      overlayToggle.classList.toggle("is-on", overlayVisible);
      overlayToggle.setAttribute("aria-pressed", String(overlayVisible));
      homeBtn.setAttribute("aria-pressed", String(activeState === "information"));
      chatBtn.setAttribute("aria-pressed", String(activeState === "response"));
      lightBtn.setAttribute("aria-pressed", String(theme === "light"));
      darkBtn.setAttribute("aria-pressed", String(theme === "dark"));
      transitionInput.value = transitionDuration;
      el("shape").value = state.shape;
      el("axis").value = state.axis;
      controls.forEach(([key]) => {
        el(key).value = state[key];
        el(`${key}Value`).textContent = state[key];
      });
      COLOR_KEYS.forEach(key => { el(key).value = state.colors[theme][key]; });
      el("editingContext").textContent = `Editing ${modeName}, ${theme} theme`;
      el("colorHint").textContent = `Saved for ${modeName} in the ${theme} theme.`;
    }

    function updateReadout() {
      const count = bg.activeParticles;
      const requested = states[activeState].particles;
      readout.textContent = count === requested
        ? `${count.toLocaleString("en-US")} particles`
        : `${count.toLocaleString("en-US")} active / ${requested.toLocaleString("en-US")}`;
    }

    // Each screen keeps its own settings and colors. Switching never rewrites either one: the runtime
    // simply regroups the flock toward the saved destination.
    function setActiveState(name) {
      if (name === activeState) return;
      activeState = name;
      app.classList.toggle("is-ai-response", name === "response");
      bg.setState(name, states[name]);
      bg.transitionTo(name, transitionDuration);
      syncControls();
      updateReadout();
      commit();
    }

    // Light and dark palettes are stored separately per screen, so toggling the theme only chooses which
    // pair is shown and edited.
    function setTheme(next) {
      if (next === theme) return;
      theme = next;
      bg.setState(activeState, states[activeState]);
      bg.setTheme(theme);
      syncControls();
      commit();
    }

    controlGroups.forEach(group => { el(group.target).innerHTML = controlMarkup(group); });
    loadSharedConfig();
    app.classList.toggle("is-ai-response", activeState === "response");

    // The editor owns the saved states. The runtime works on copies and is driven through its public
    // API only (update, setState, setTheme, transitionTo, clear), exactly like an integrator.
    const bg = createMurmurationRuntime(stage, {
      states,
      initialState: activeState,
      transitionDuration,
      theme,
      renderer: new URLSearchParams(location.search).get("renderer") || "webgl2"
    });
    const canvas = bg.canvas;
    syncControls();

    controls.forEach(([key]) => {
      const input = el(key);
      input.addEventListener("input", () => {
        const value = Number(input.value);
        states[activeState][key] = value;
        el(`${key}Value`).textContent = value;
        bg.update({ [key]: value });
        if (key === "particles") updateReadout();
        commit();
      });
    });

    ["shape", "axis"].forEach(key => {
      el(key).addEventListener("change", event => {
        states[activeState][key] = event.target.value;
        // update() regroups the flock toward a new shape and clears stale trails.
        bg.update({ [key]: event.target.value });
        commit();
      });
    });

    COLOR_KEYS.forEach(key => {
      el(key).addEventListener("input", event => {
        states[activeState].colors[theme][key] = event.target.value;
        bg.update({ [key]: event.target.value });
        commit();
      });
    });

    transitionInput.addEventListener("change", () => {
      transitionDuration = clamp(Number(transitionInput.value) || 0, 0, 5000);
      transitionInput.value = transitionDuration;
      app.style.setProperty("--dur", `${transitionDuration}ms`);
      commit();
    });

    homeBtn.addEventListener("click", () => setActiveState("information"));
    chatBtn.addEventListener("click", () => setActiveState("response"));
    lightBtn.addEventListener("click", () => setTheme("light"));
    darkBtn.addEventListener("click", () => setTheme("dark"));

    overlayToggle.addEventListener("click", () => {
      overlayVisible = !overlayVisible;
      syncControls();
      commit();
    });

    panelToggle.addEventListener("click", () => {
      const isHidden = app.classList.toggle("is-panel-hidden");
      panelToggle.textContent = isHidden ? "Show panel" : "Hide panel";
      panelToggle.setAttribute("aria-expanded", String(!isHidden));
      // The runtime follows its container with a ResizeObserver; refresh the active count afterwards.
      requestAnimationFrame(updateReadout);
    });

    copyBtn.addEventListener("click", () => copyText(exportCode.value, "Snippet"));
    copyPreviewBtn.addEventListener("click", () => copyText(getPreviewUrl(), "Preview link"));

    downloadBtn.addEventListener("click", () => {
      const blob = new Blob([exportedModule()], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "murmuration-background.js";
      link.click();
      URL.revokeObjectURL(url);
      announce("Downloaded murmuration-background.js.");
    });

    refreshExport();
    updateReadout();
    addEventListener("resize", updateReadout);
  </script>
</body>
</html>
